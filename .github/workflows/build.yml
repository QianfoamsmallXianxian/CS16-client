name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ndk_version:
        required: false
        default: '29.0.14206865'
      sdl_version:
        required: false
        default: '2.32.10'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: ${{ github.event.inputs.sdl_version || '2.32.10' }}
  TARGET_ABI: arm64-v8a
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: ${{ github.event.inputs.ndk_version || '29.0.14206865' }}
  ANDROID_CMAKE: 3.22.1

jobs:
  engine:
    name: Build Xash3D Engine
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip xz-utils

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.ccache
            android/.cxx
          key: xash-${{ env.TARGET_ABI }}-${{ env.ANDROID_NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            xash-${{ env.TARGET_ABI }}-${{ env.ANDROID_NDK_VERSION }}-
            xash-${{ env.TARGET_ABI }}-

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java
          java -version

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          test -n "$SDKMGR" || { echo "no sdkmanager"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE}" || true
          ls "$GITHUB_WORKSPACE/sdk/ndk/" || true

      - name: Prepare deps
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/hlsdk-portable 3rdparty/SDL
          git clone --depth 1 --recursive https://github.com/FWGS/hlsdk-portable 3rdparty/hlsdk-portable
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Patch deps_android
        run: |
          if [ -f scripts/gha/deps_android.sh ]; then
            printf '#!/bin/bash\nexit 0\n' > scripts/gha/deps_android.sh
            chmod +x scripts/gha/deps_android.sh
          fi

      - name: Build engine
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          bash scripts/gha/build_android.sh

      - name: Extract so
        if: success()
        run: |
          mkdir -p engine-libs
          find . -path '*arm64*' -name '*.so' -exec cp -v {} engine-libs/ \; || true
          if [ -z "$(ls -A engine-libs 2>/dev/null)" ]; then
            find . -name '*.so' \
              ! -path '*x86*' ! -path '*armeabi-v7a*' ! -path '*i686*' \
              -exec cp -v {} engine-libs/ \;
          fi
          test -n "$(ls -A engine-libs 2>/dev/null)" || { echo "no so"; exit 1; }
          ls -lh engine-libs/

      - name: Upload engine libs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engine-libs
          path: engine-libs/*.so
          retention-days: 7
          if-no-files-found: error

  apk:
    name: Build CS16 Client APK
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: engine-libs
          path: engine-libs

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java
          java -version

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          test -n "$SDKMGR" || { echo "no sdkmanager"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE}" || true

      - name: Prepare SDL
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/SDL
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Write functional FWGSLib
        run: |
          set -euo pipefail
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || { echo "no mainui CMakeLists"; exit 1; }
          mkdir -p cmake
          cat > cmake/FWGSLib.cmake << 'CMEOF'
          include(CMakeParseArguments)

          macro(fwgs_fix_default_msvc_settings)
              if(MSVC)
                  add_compile_options(/MP /permissive-)
                  add_compile_definitions(_CRT_SECURE_NO_WARNINGS NOMINMAX WIN32_LEAN_AND_MEAN)
              endif()
          endmacro()

          function(fwgs_set_default_properties target)
              set_target_properties(${target} PROPERTIES
                  CXX_STANDARD 17
                  CXX_STANDARD_REQUIRED ON
                  CXX_EXTENSIONS OFF
                  C_STANDARD 11
                  C_STANDARD_REQUIRED ON
                  POSITION_INDEPENDENT_CODE ON
              )
          endfunction()

          function(fwgs_add_compile_options target)
              cmake_parse_arguments(ARG "" "" "PRIVATE;PUBLIC;INTERFACE" ${ARGN})
              if(ARG_PRIVATE)
                  target_compile_options(${target} PRIVATE ${ARG_PRIVATE})
              endif()
              if(ARG_PUBLIC)
                  target_compile_options(${target} PUBLIC ${ARG_PUBLIC})
              endif()
              if(ARG_INTERFACE)
                  target_compile_options(${target} INTERFACE ${ARG_INTERFACE})
              endif()
          endfunction()

          function(fwgs_install target)
              if(COMMAND install)
                  install(TARGETS ${target}
                      RUNTIME DESTINATION bin
                      LIBRARY DESTINATION lib
                      ARCHIVE DESTINATION lib)
              endif()
          endfunction()
          CMEOF
          cat cmake/FWGSLib.cmake

          if ! grep -q 'list(APPEND CMAKE_MODULE_PATH' "$MF"; then
            sed -i "1i list(APPEND CMAKE_MODULE_PATH \"\${CMAKE_CURRENT_SOURCE_DIR}/../../cmake\")" "$MF"
          fi
          sed -i 's|^[[:space:]]*# *include(FWGSLib)|include(FWGSLib)|' "$MF" || true
          sed -i 's|^[[:space:]]*# *fwgs_fix_default_msvc_settings()|fwgs_fix_default_msvc_settings()|' "$MF" || true

      - name: Patch desktop deps
        run: |
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          python3 - << 'PY'
          import re, pathlib
          p = pathlib.Path('3rdparty/mainui_cpp/CMakeLists.txt')
          lines = p.read_text().splitlines()
          out = []
          targets = ('fontconfig','freetype','freetype2','x11','wayland','glib','pango','xkbcommon','xi','xcursor','xinerama','xrandr','xss','xext','alsa','pulse','pulseaudio','dbus','libusb','udev')
          for ln in lines:
              m = re.match(r'^(\s*)pkg_check_modules\s*\(\s*(\S+)\s+(?:REQUIRED\s+|QUIET\s+|NO_CMAKE_PATH\s+)*([\w.-]+)', ln)
              m2 = re.match(r'^(\s*)pkg_search_module\s*\(\s*(\S+)\s+(?:REQUIRED\s+|QUIET\s+)*([\w.-]+)', ln)
              mm = m or m2
              if mm:
                  indent = mm.group(1)
                  module = mm.group(3).lower().split('>=')[0].split('<')[0].strip()
                  if module in targets or any(module.startswith(t) for t in targets):
                      out.append(f'{indent}if(NOT ANDROID)')
                      out.append(ln)
                      out.append(f'{indent}endif()')
                      continue
              out.append(ln)
          p.write_text('\n'.join(out) + '\n')
          PY

      - name: Fix mainui sources
        run: |
          set +e
          echo "=== grep Color.cpp ==="
          grep -rn 'Color\.cpp' 3rdparty/mainui_cpp/ || true
          echo "=== color files ==="
          find 3rdparty/mainui_cpp -iname '*color*' || true
          python3 - << 'PY'
          import pathlib, re
          root = pathlib.Path('3rdparty/mainui_cpp').resolve()
          if not root.exists():
              raise SystemExit(0)
          exts = r'(?:cpp|cc|cxx|c)'
          pat = re.compile(r'(?<![A-Za-z0-9_./-])([A-Za-z0-9_./-]+\.' + exts + r')(?![A-Za-z0-9_])')
          removed, renamed, changed = [], [], []
          for cm in list(root.rglob('CMakeLists.txt')) + list(root.rglob('*.cmake')):
              try:
                  text = cm.read_text()
              except Exception:
                  continue
              base = cm.parent
              new = text
              for m in pat.finditer(text):
                  rel = m.group(1)
                  if (base / rel).resolve().exists():
                      continue
                  name = pathlib.Path(rel).name
                  hits = [x for x in base.rglob('*') if x.is_file() and x.name.lower() == name.lower()]
                  if hits:
                      nr = str(hits[0].relative_to(base)).replace('\\','/')
                      new = new.replace(rel, nr)
                      renamed.append((str(cm), rel, nr))
                      continue
                  new = re.sub(r'(?m)^[ \t]*' + re.escape(rel) + r'[ \t]*\n', '', new)
                  new = re.sub(r'\s+' + re.escape(rel) + r'(?=\s)', ' ', new)
                  removed.append((str(cm), rel))
              if new != text:
                  cm.write_text(new)
                  changed.append(str(cm))
          print("=== changed ===")
          for f in changed: print("  ", f)
          print("=== renamed ===")
          for cm, a, b in renamed: print(f"   {cm}: {a} -> {b}")
          print("=== removed ===")
          for cm, rel in removed: print(f"   {cm}: {rel}")
          PY
          grep -rn 'Color\.cpp' 3rdparty/mainui_cpp/ || echo "OK: none"

      - name: Fix int64 typedef conflict
        run: |
          set +e
          python3 - << 'PY'
          import pathlib
          GUARD = 'XASH_INT64_TYPES_DEFINED'
          MINIUTL = pathlib.Path('3rdparty/mainui_cpp/miniutl/miniutl.h')
          ARCH = pathlib.Path('engine/archtypes.h')
          if MINIUTL.exists():
              s = MINIUTL.read_text()
              if GUARD not in s:
                  s = s.replace('typedef int64_t int64;',
                                '#ifndef ' + GUARD + '\ntypedef int64_t int64;')
                  s = s.replace('typedef uint64_t uint64;',
                                'typedef uint64_t uint64;\n#endif')
                  s = s.replace('typedef int64_t int64 ;',
                                '#ifndef ' + GUARD + '\ntypedef int64_t int64 ;')
                  s = s.replace('typedef uint64_t uint64 ;',
                                'typedef uint64_t uint64 ;\n#endif')
                  MINIUTL.write_text(s)
                  print('patched miniutl.h')
              else:
                  print('miniutl.h already patched')
          if ARCH.exists():
              s = ARCH.read_text()
              if GUARD not in s:
                  s = s.replace('typedef long long int64;',
                                '#ifndef ' + GUARD + '\n#define ' + GUARD + ' 1\ntypedef long long int64;')
                  s = s.replace('typedef unsigned long long uint64;',
                                'typedef unsigned long long uint64;\n#endif')
                  ARCH.write_text(s)
                  print('patched archtypes.h')
              else:
                  print('archtypes.h already has guard')
          PY
          echo "=== miniutl.h ==="
          grep -n -B1 -A1 'int64\|uint64' 3rdparty/mainui_cpp/miniutl/miniutl.h 2>/dev/null | head -20 || true
          echo "=== archtypes.h ==="
          grep -n -B1 -A1 'int64\|uint64' engine/archtypes.h 2>/dev/null | head -20 || true

      - name: Inject engine libs
        run: |
          DEST="android/app/src/main/jniLibs/${TARGET_ABI}"
          mkdir -p "$DEST"
          cp -v engine-libs/*.so "$DEST/"
          ls -lh "$DEST/"

      - name: Set app name
        run: |
          python3 - << 'PY'
          import re, pathlib
          sp = pathlib.Path('android/app/src/main/res/values/strings.xml')
          if sp.exists():
              s = sp.read_text()
              if 'name="app_name"' in s:
                  s = re.sub(r'<string name="app_name">[^<]*</string>',
                             '<string name="app_name">Counter Strike 1.6</string>', s)
              else:
                  s = s.replace('</resources>',
                                '    <string name="app_name">Counter Strike 1.6</string>\n</resources>')
              sp.write_text(s)
          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if mf.exists():
              s = mf.read_text()
              if 'android:label="@string/app_name"' not in s:
                  s = re.sub(r'android:label="[^"]*"',
                             'android:label="Counter Strike 1.6"', s)
                  mf.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleGitDebug

      - name: Locate APK
        if: always()
        run: |
          find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true

      - name: Package APK
        if: success()
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          OUT="CS16Client-${TARGET_ABI}-standalone.apk"
          cp "$APK" "$OUT"
          echo "=== native libs ==="
          unzip -l "$OUT" | grep '\.so' || true
          echo "=== size ==="
          ls -lh "$OUT"
          echo "=== sha256 ==="
          sha256sum "$OUT"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CS16Client-standalone
          path: CS16Client-${TARGET_ABI}-standalone.apk
          retention-days: 30
          if-no-files-found: error
