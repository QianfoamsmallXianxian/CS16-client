name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: r26d
  TARGET_ABI: arm64-v8a

jobs:
  engine:
    name: Build Xash3D Engine
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          path: xash3d-fwgs
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Cache xash
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            xash3d-fwgs/android/.cxx
          key: xash-${{ env.TARGET_ABI }}-${{ env.NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            xash-${{ env.TARGET_ABI }}-${{ env.NDK_VERSION }}-
            xash-${{ env.TARGET_ABI }}-

      - name: Diagnose xash android
        working-directory: xash3d-fwgs
        run: |
          echo "=== android/app/build.gradle.kts 里的关键行 ==="
          grep -nE 'SDL|sdl|abiFilter|java.directories|cmake|CMake|ninja' android/app/build.gradle.kts || true
          echo "=== 3rdparty 顶层 ==="
          ls 3rdparty/ || true
          echo "=== 官方 CI ==="
          ls .github/workflows/ 2>/dev/null || true
          head -100 .github/workflows/c-cpp.yml 2>/dev/null || true

      - name: Clone SDL2 full into 3rdparty/SDL
        working-directory: xash3d-fwgs
        run: |
          set -euo pipefail
          rm -rf 3rdparty/SDL
          git clone --depth 1 --branch release-2.30.x \
            https://github.com/libsdl-org/SDL.git 3rdparty/SDL
          echo "=== SDL 顶层 ==="
          ls 3rdparty/SDL/ | head
          echo "=== SDL android-project ==="
          ls 3rdparty/SDL/android-project/app/src/main/java/org/libsdl/app/ | head
          echo "=== SDL CMakeLists ==="
          ls 3rdparty/SDL/CMakeLists.txt

      - name: Copy SDL Java into app
        working-directory: xash3d-fwgs/android
        run: |
          set -euo pipefail
          SRC=../3rdparty/SDL/android-project/app/src/main/java/org/libsdl/app
          DEST=app/src/main/java/org/libsdl/app
          test -d "$SRC" || { echo "SDL java 目录不存在: $SRC"; exit 1; }
          mkdir -p "$DEST"
          cp -v "$SRC"/*.java "$DEST/"
          ls -la "$DEST/"

      - name: Build engine
        working-directory: xash3d-fwgs/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Extract so
        run: |
          set -euo pipefail
          mkdir -p engine-libs
          APK=$(find xash3d-fwgs -name '*.apk' | head -1 || true)
          echo "APK=$APK"
          if [ -n "$APK" ]; then
            unzip -j "$APK" "lib/${{ env.TARGET_ABI }}/*.so" -d engine-libs/ || true
          fi
          if [ -z "$(ls -A engine-libs 2>/dev/null)" ]; then
            find xash3d-fwgs -path "*${{ env.TARGET_ABI }}*" -name '*.so' \
              -exec cp -v {} engine-libs/ \;
          fi
          ls -lh engine-libs/ || true
          test -n "$(ls -A engine-libs 2>/dev/null)" || { echo "no so"; exit 1; }

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-libs
          path: engine-libs/*.so
          retention-days: 7
          if-no-files-found: error

  apk:
    name: Build Standalone APK
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: engine-libs
          path: engine-libs

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Inject engine
        run: |
          set -euo pipefail
          DEST="android/app/src/main/jniLibs/${{ env.TARGET_ABI }}"
          mkdir -p "$DEST"
          cp -v engine-libs/*.so "$DEST/"
          ls -lh "$DEST/"

      - name: Set app name
        run: |
          python3 - << 'PY'
          import re, pathlib
          sp = pathlib.Path('android/app/src/main/res/values/strings.xml')
          if sp.exists():
              s = sp.read_text()
              if 'name="app_name"' in s:
                  s = re.sub(r'<string name="app_name">[^<]*</string>',
                             '<string name="app_name">Counter Strike 1.6</string>', s)
              else:
                  s = s.replace('</resources>',
                                '    <string name="app_name">Counter Strike 1.6</string>\n</resources>')
              sp.write_text(s)
          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if mf.exists():
              s = mf.read_text()
              if 'android:label="@string/app_name"' not in s:
                  s = re.sub(r'android:label="[^"]*"',
                             'android:label="Counter Strike 1.6"', s)
                  mf.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleGitDebug

      - name: Package APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          OUT="CS16Client-${{ env.TARGET_ABI }}-standalone.apk"
          cp "$APK" "$OUT"
          unzip -l "$OUT" | grep '\.so' || true
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CS16Client-standalone
          path: CS16Client-${{ env.TARGET_ABI }}-standalone.apk
          retention-days: 30
          if-no-files-found: error
