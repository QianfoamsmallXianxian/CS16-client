name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: 2.32.10
  FFMPEG_VERSION: '9.0'
  YY_THUNKS_VERSION: v1.2.1
  TARGET_ABI: arm64-v8a

jobs:
  engine:
    name: Build Xash3D Engine
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip

      - name: Diagnose
        run: |
          pwd
          ls -la
          ls scripts/gha/ || true
          echo "=== deps_android.sh ==="
          cat scripts/gha/deps_android.sh || true
          echo "=== build_android.sh ==="
          cat scripts/gha/build_android.sh || true
          echo "=== c-cpp.yml android job ==="
          sed -n '/android/,/^  [a-z]/p' .github/workflows/c-cpp.yml 2>/dev/null | head -140 || true

      - name: Run deps_android.sh
        run: |
          set -euo pipefail
          chmod +x scripts/gha/*.sh scripts/*.sh 2>/dev/null || true
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            if bash scripts/gha/deps_android.sh; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Run build_android.sh
        run: |
          set -euo pipefail
          bash scripts/gha/build_android.sh

      - name: Locate build outputs
        run: |
          find . -maxdepth 2 -type d -name 'build*' || true
          find . -path '*arm64*' -name '*.so' -exec ls -lh {} \; || true
          find . -name '*.apk' -exec ls -lh {} \; || true
          find . -name '*.so' | head -60 || true

      - name: Extract so
        run: |
          set -euo pipefail
          mkdir -p engine-libs
          find . -path '*arm64*' -name '*.so' -exec cp -v {} engine-libs/ \; || true
          if [ -z "$(ls -A engine-libs 2>/dev/null)" ]; then
            find . -name '*.so' \
              ! -path '*x86*' ! -path '*armeabi-v7a*' ! -path '*i686*' \
              -exec cp -v {} engine-libs/ \;
          fi
          ls -lh engine-libs/ || true
          test -n "$(ls -A engine-libs 2>/dev/null)" || { echo "no so"; exit 1; }

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-libs
          path: engine-libs/*.so
          retention-days: 7
          if-no-files-found: error

  apk:
    name: Build Standalone APK
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: engine-libs
          path: engine-libs

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Inject engine
        run: |
          set -euo pipefail
          DEST="android/app/src/main/jniLibs/${{ env.TARGET_ABI }}"
          mkdir -p "$DEST"
          cp -v engine-libs/*.so "$DEST/"
          ls -lh "$DEST/"

      - name: Set app name
        run: |
          python3 - << 'PY'
          import re, pathlib
          sp = pathlib.Path('android/app/src/main/res/values/strings.xml')
          if sp.exists():
              s = sp.read_text()
              if 'name="app_name"' in s:
                  s = re.sub(r'<string name="app_name">[^<]*</string>',
                             '<string name="app_name">Counter Strike 1.6</string>', s)
              else:
                  s = s.replace('</resources>',
                                '    <string name="app_name">Counter Strike 1.6</string>\n</resources>')
              sp.write_text(s)
          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if mf.exists():
              s = mf.read_text()
              if 'android:label="@string/app_name"' not in s:
                  s = re.sub(r'android:label="[^"]*"',
                             'android:label="Counter Strike 1.6"', s)
                  mf.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleGitDebug

      - name: Package APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          OUT="CS16Client-${{ env.TARGET_ABI }}-standalone.apk"
          cp "$APK" "$OUT"
          unzip -l "$OUT" | grep '\.so' || true
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CS16Client-standalone
          path: CS16Client-${{ env.TARGET_ABI }}-standalone.apk
          retention-days: 30
          if-no-files-found: error
