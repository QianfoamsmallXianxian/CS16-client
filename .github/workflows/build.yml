name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ndk_version:
        description: 'NDK version'
        required: false
        default: 'r26d'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: ${{ github.event.inputs.ndk_version || 'r26d' }}
  TARGET_ABI: arm64-v8a

jobs:
  engine:
    name: Build Xash3D Engine
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          path: xash3d-fwgs
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
