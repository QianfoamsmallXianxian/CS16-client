name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: 2.32.10
  TARGET_ABI: arm64-v8a
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_CMAKE: 3.22.1

jobs:
  engine:
    name: Build Xash3D Engine
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip xz-utils

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE}" || true

      - name: Prepare deps
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/hlsdk-portable 3rdparty/SDL
          git clone --depth 1 --recursive https://github.com/FWGS/hlsdk-portable 3rdparty/hlsdk-portable
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Patch deps
        run: |
          if [ -f scripts/gha/deps_android.sh ]; then
            printf '#!/bin/bash\nexit 0\n' > scripts/gha/deps_android.sh
            chmod +x scripts/gha/deps_android.sh
          fi

      - name: Build engine
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          bash scripts/gha/build_android.sh

      - name: Extract so
        run: |
          mkdir -p engine-libs
          find . -path '*arm64*' -name '*.so' -exec cp -v {} engine-libs/ \; || true
          if [ -z "$(ls -A engine-libs 2>/dev/null)" ]; then
            find . -name '*.so' ! -path '*x86*' ! -path '*armeabi-v7a*' -exec cp -v {} engine-libs/ \;
          fi
          test -n "$(ls -A engine-libs 2>/dev/null)"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-libs
          path: engine-libs/*.so
          retention-days: 7
          if-no-files-found: error

  apk:
    name: Build CS16 Client APK
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: engine-libs
          path: engine-libs

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip meson gperf

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE}" || true

      - name: Prepare SDL
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/SDL
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Generate cross file
        run: |
          NDK="$ANDROID_NDK_HOME"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '[binaries]\nc = \'%s/aarch64-linux-android21-clang\'\ncpp = \'%s/aarch64-linux-android21-clang++\'\nar = \'%s/llvm-ar\'\nstrip = \'%s/llvm-strip\'\npkg-config = \'/usr/bin/pkg-config\'\n[host_machine]\nsystem = \'android\'\ncpu_family = \'aarch64\'\ncpu = \'aarch64\'\nendian = \'little\'\n[properties]\nneeds_exe_wrapper = true\n' "$BIN" "$BIN" "$BIN" "$BIN" > /tmp/android-arm64.ini
          cat /tmp/android-arm64.ini

      - name: Build expat
        run: |
          set -e
          SYS=${{ github.workspace }}/sysroot
          mkdir -p "$SYS"
          cd /tmp
          wget -q https://github.com/libexpat/libexpat/releases/download/R_2_5_0/expat-2.5.0.tar.gz -O expat.tar.gz
          tar xzf expat.tar.gz
          cd expat-2.5.0
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${TARGET_ABI} -DANDROID_PLATFORM=android-21 -DCMAKE_INSTALL_PREFIX="$SYS" -DEXPAT_BUILD_TOOLS=OFF -DEXPAT_BUILD_EXAMPLES=OFF -DEXPAT_BUILD_TESTS=OFF -DEXPAT_BUILD_DOCS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target install
          ls -lh "$SYS/lib/" "$SYS/include/" || true

      - name: Build freetype
        run: |
          set -e
          SYS=${{ github.workspace }}/sysroot
          cd /tmp
          wget -q https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz -O ft.tar.gz
          tar xzf ft.tar.gz
          cd freetype-2.13.2
          meson setup build --cross-file /tmp/android-arm64.ini --prefix="$SYS" --default-library=static -Dharfbuzz=disabled -Dbzip2=disabled -Dpng=disabled -Dbrotli=disabled -Dzlib=system -Dtests=disabled
          ninja -C build
          ninja -C build install
          ls "$SYS/lib/" | grep -i freetype || true

      - name: Build fontconfig
        run: |
          set -e
          SYS=${{ github.workspace }}/sysroot
          cd /tmp
          wget -q https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/2.14.2/fontconfig-2.14.2.tar.gz -O fc.tar.gz
          tar xzf fc.tar.gz
          cd fontconfig-2.14.2
          export PKG_CONFIG_PATH="$SYS/lib/pkgconfig:$SYS/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYS/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYS"
          meson setup build --cross-file /tmp/android-arm64.ini --prefix="$SYS" --default-library=static -Ddoc=disabled -Dnls=disabled -Dtests=disabled -Dtools=disabled -Dcache-build=disabled
          ninja -C build
          ninja -C build install
          ls "$SYS/lib/" | grep -i fontconfig || true
          find "$SYS/include" -name 'fontconfig.h' || true

      - name: Wire fontconfig
        run: |
          SYS=${{ github.workspace }}/sysroot
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          if ! grep -q 'CI_FONTCONFIG_WIRED' "$MF"; then
            {
              echo ''
              echo '# CI_FONTCONFIG_WIRED'
              echo 'if(TARGET ${MAINUI_LIBRARY})'
              echo '    target_include_directories(${MAINUI_LIBRARY} PRIVATE'
              echo "        $SYS/include"
              echo "        $SYS/include/freetype2"
              echo '    )'
              echo '    target_link_libraries(${MAINUI_LIBRARY} PRIVATE'
              echo "        $SYS/lib/libfontconfig.a"
              echo "        $SYS/lib/libfreetype.a"
              echo "        $SYS/lib/libexpat.a"
              echo '    )'
              echo 'endif()'
            } >> "$MF"
          fi
          grep -n 'CI_FONTCONFIG_WIRED' "$MF" || true

      - name: Fix FWGSLib
        run: |
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          mkdir -p cmake
          printf 'include(CMakeParseArguments)\nmacro(fwgs_fix_default_msvc_settings)\nendmacro()\nfunction(fwgs_set_default_properties target)\n    set_target_properties(${target} PROPERTIES CXX_STANDARD 17 CXX_STANDARD_REQUIRED ON POSITION_INDEPENDENT_CODE ON)\nendfunction()\nfunction(fwgs_add_compile_options target)\n    cmake_parse_arguments(ARG "" "" "PRIVATE;PUBLIC;INTERFACE" ${ARGN})\n    if(ARG_PRIVATE)\n        target_compile_options(${target} PRIVATE ${ARG_PRIVATE})\n    endif()\n    if(ARG_PUBLIC)\n        target_compile_options(${target} PUBLIC ${ARG_PUBLIC})\n    endif()\n    if(ARG_INTERFACE)\n        target_compile_options(${target} INTERFACE ${ARG_INTERFACE})\n    endif()\nendfunction()\nfunction(fwgs_install target)\nendfunction()\n' > cmake/FWGSLib.cmake
          grep -q 'list(APPEND CMAKE_MODULE_PATH' "$MF" || sed -i "1i list(APPEND CMAKE_MODULE_PATH \"\${CMAKE_CURRENT_SOURCE_DIR}/../../cmake\")" "$MF"
          sed -i 's|^[[:space:]]*# *include(FWGSLib)|include(FWGSLib)|' "$MF"
          sed -i 's|^[[:space:]]*# *fwgs_fix_default_msvc_settings()|fwgs_fix_default_msvc_settings()|' "$MF"

      - name: Wrap desktop deps
        run: python3 ci-scripts/wrap_desktop.py

      - name: Fix XASH_SDK and STDINT_H
        run: |
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          grep -q 'xashmenu fixed include dirs' "$MF" || printf '\nif(TARGET ${MAINUI_LIBRARY})\n    target_include_directories(${MAINUI_LIBRARY} PRIVATE\n        ${CMAKE_CURRENT_SOURCE_DIR}/../../common\n        ${CMAKE_CURRENT_SOURCE_DIR}/../../engine\n        ${CMAKE_CURRENT_SOURCE_DIR}/../../pm_shared\n        ${CMAKE_CURRENT_SOURCE_DIR}/../../public\n    )\nendif()\n' >> "$MF"
          grep -q 'STDINT_H compile definition' "$MF" || printf '\nif(TARGET ${MAINUI_LIBRARY})\n    target_compile_definitions(${MAINUI_LIBRARY} PRIVATE "STDINT_H=<cstdint>")\nendif()\n' >> "$MF"
          python3 ci-scripts/fix_xashsdk.py

      - name: Fix sources
        run: python3 ci-scripts/fix_sources.py

      - name: Fix _format and int3
        run: |
          PH=common/port.h
          if [ -f "$PH" ] && ! grep -q 'define[[:space:]]*_format' "$PH"; then
            printf '\n#ifndef _format\n#if defined(__GNUC__)\n#define _format(x) __attribute__((format(printf,x,x+1)))\n#else\n#define _format(x)\n#endif\n#endif\n' >> "$PH"
          fi
          F=engine/menu_int.h
          if [ -f "$F" ] && ! grep -q '_format_fallback_injected' "$F"; then
            printf '/* CI _format_fallback_injected */\n#ifndef _format\n# if defined(__GNUC__)\n#  define _format(x) __attribute__((format(printf,x,x+1)))\n# else\n#  define _format(x)\n# endif\n#endif\n\n' > /tmp/mi_header.txt
            cat /tmp/mi_header.txt "$F" > /tmp/mi_new.h
            mv /tmp/mi_new.h "$F"
          fi
          python3 ci-scripts/fix_int3.py

      - name: Fix saverestore and version script
        run: |
          python3 ci-scripts/fix_saverestore.py
          MF=3rdparty/ReGameDLL_CS/CMakeLists.txt
          if [ -f "$MF" ] && ! grep -q 'CI_RELAX_PTR_CAST' "$MF"; then
            printf '\n# CI_RELAX_PTR_CAST\nadd_compile_options(-Wno-error=int-to-pointer-cast)\nadd_compile_options(-Wno-error=pointer-to-int-cast)\nadd_compile_options(-Wno-error=int-conversion)\nadd_compile_options(-Wno-error=constant-conversion)\nadd_compile_options(-Wno-error=shorten-64-to-32)\nadd_link_options(-Wl,--undefined-version)\n' >> "$MF"
          fi

      - name: Inject engine libs
        run: |
          DEST="android/app/src/main/jniLibs/${TARGET_ABI}"
          mkdir -p "$DEST"
          cp -v engine-libs/*.so "$DEST/"

      - name: Set app name
        run: |
          python3 - << 'PYNAM'
import re, pathlib
sp = pathlib.Path('android/app/src/main/res/values/strings.xml')
if sp.exists():
    s = sp.read_text()
    if 'name="app_name"' in s:
        s = re.sub(r'<string name="app_name">[^<]*</string>', '<string name="app_name">Counter Strike 1.6</string>', s)
    else:
        s = s.replace('</resources>', '    <string name="app_name">Counter Strike 1.6</string>\n</resources>')
    sp.write_text(s)
mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
if mf.exists():
    s = mf.read_text()
    if 'android:label="@string/app_name"' not in s:
        s = re.sub(r'android:label="[^"]*"', 'android:label="Counter Strike 1.6"', s)
        mf.write_text(s)
PYNAM

      - name: Build APK
        id: build_apk
        continue-on-error: true
        working-directory: android
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleGitDebug 2>&1 | tee /tmp/build_apk.log

      - name: Extract errors
        if: always()
        run: |
          mkdir -p /tmp/errors
          LOG=/tmp/build_apk.log
          OUT=/tmp/errors/errors.txt
          {
            echo "=== run_id: ${{ github.run_id }} ==="
            echo "=== commit: ${{ github.sha }} ==="
            echo ""
            echo "=== REAL ERRORS ==="
          } > "$OUT"
          if [ ! -f "$LOG" ]; then
            echo "no log" >> "$OUT"
            cat "$OUT"
            exit 0
          fi
          FILTER='force_align_arg_pointer|unknown-attributes|Wunknown-attributes|Wdeprecated-declarations|overrides a member function|no previous prototype|Wunused|Wsign-compare|Wshadow|Wformat|declared here|note: expanded|in file included from|^note:|Wmissing-braces|Wpragma-pack|Wdivision-by-zero|Wswitch|Wparentheses|Wtautological|Wbitwise|Wsometimes-uninitialized|Wmacro-redefined|previous definition is here'
          grep -nE "error:|fatal error:|FAILED:|FAILURE:|undefined reference|ninja: build stopped|What went wrong|Execution failed|Caused by:|ld: |cannot find|undeclared|unknown type name|expected .* before|unrecognized|cannot open|no such file" "$LOG" | grep -vE "$FILTER" | head -200 >> "$OUT" || true
          {
            echo ""
            echo "=== TAIL (last 60) ==="
          } >> "$OUT"
          tail -60 "$LOG" | grep -vE "$FILTER" >> "$OUT" || true
          wc -l "$OUT"
          cat "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-errors-log
          path: /tmp/errors/errors.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Package APK
        if: success()
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          OUT="CS16Client-${TARGET_ABI}-standalone.apk"
          cp "$APK" "$OUT"
          unzip -l "$OUT" | grep '\.so' || true
          sha256sum "$OUT"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CS16Client-standalone
          path: CS16Client-${TARGET_ABI}-standalone.apk
          retention-days: 30
          if-no-files-found: error
