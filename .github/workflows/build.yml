name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: 2.32.10
  TARGET_ABI: arm64-v8a
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_CMAKE: 3.22.1
  APP_NAME: "Counter Strike 1.6"

jobs:
  engine:
    name: Build Engine + APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip xz-utils

      - name: Cache gradle ccache cxx
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.ccache
            android/.cxx
          key: xash-${{ env.TARGET_ABI }}-${{ env.ANDROID_NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            xash-${{ env.TARGET_ABI }}-${{ env.ANDROID_NDK_VERSION }}-
            xash-${{ env.TARGET_ABI }}-

      - name: Link JDK
        run: |
          set -euo pipefail
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java
          java -version

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          test -n "$SDKMGR" || { echo "no sdkmanager"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE}" || true
          ls "$GITHUB_WORKSPACE/sdk/ndk/" || true

      - name: Prepare deps
        run: |
          set -euo pipefail
          mkdir -p 3rdparty
          rm -rf 3rdparty/hlsdk-portable 3rdparty/SDL
          git clone --depth 1 --recursive https://github.com/FWGS/hlsdk-portable 3rdparty/hlsdk-portable
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL
          ls -d 3rdparty/SDL 3rdparty/hlsdk-portable

      - name: Patch deps_android
        run: |
          if [ -f scripts/gha/deps_android.sh ]; then
            printf '#!/bin/bash\nexit 0\n' > scripts/gha/deps_android.sh
            chmod +x scripts/gha/deps_android.sh
          fi

      - name: Build engine
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          set -euo pipefail
          bash scripts/gha/build_android.sh

      - name: Collect outputs
        if: always()
        run: |
          find . -maxdepth 3 -type d -name 'build*' || true
          find . -path '*arm64*' -name '*.so' -exec ls -lh {} \; || true
          find . -name '*.apk' -exec ls -lh {} \; || true

      - name: Extract artifacts
        if: success()
        run: |
          set -euo pipefail
          mkdir -p engine-libs engine-apk
          find . -path '*arm64*' -name '*.so' -exec cp -v {} engine-libs/ \; || true
          if [ -z "$(ls -A engine-libs 2>/dev/null)" ]; then
            find . -name '*.so' \
              ! -path '*x86*' ! -path '*armeabi-v7a*' ! -path '*i686*' \
              -exec cp -v {} engine-libs/ \;
          fi
          test -n "$(ls -A engine-libs 2>/dev/null)" || { echo "no so"; exit 1; }
          find . -name '*.apk' -exec cp -v {} engine-apk/ \; || true
          test -n "$(ls -A engine-apk 2>/dev/null)" || { echo "no apk"; exit 1; }
          ls -lh engine-libs/
          ls -lh engine-apk/

      - name: Upload engine libs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engine-libs
          path: engine-libs/*.so
          retention-days: 7
          if-no-files-found: error

      - name: Upload engine APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engine-apk
          path: engine-apk/*.apk
          retention-days: 14
          if-no-files-found: error

  package:
    name: Package Standalone APK
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Install apktool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zipalign unzip
          APKTOOL_VER=2.9.3
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" -O /tmp/apktool.jar
          sudo mv /tmp/apktool.jar /usr/local/bin/apktool.jar
          printf '#!/bin/bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version
          rm -rf ~/.local/share/apktool/framework || true

      - name: Download engine APK
        uses: actions/download-artifact@v4
        with:
          name: engine-apk
          path: apk-in

      - name: Locate APK
        id: find
        run: |
          set -euo pipefail
          ls -lh apk-in/
          APK=$(find apk-in -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Decode APK
        run: |
          set -euo pipefail
          apktool d -f "${{ steps.find.outputs.apk }}" -o decoded

      - name: Rename app
        run: |
          set -euo pipefail
          MF=decoded/AndroidManifest.xml
          if [ -f "$MF" ]; then
            sed -i 's/android:label="[^"]*"/android:label="${{ env.APP_NAME }}"/g' "$MF" || true
          fi
          STR=decoded/res/values/strings.xml
          if [ -f "$STR" ]; then
            python3 - << 'PY'
          import re, pathlib
          sp = pathlib.Path('decoded/res/values/strings.xml')
          s = sp.read_text()
          if 'name="app_name"' in s:
              s = re.sub(r'<string name="app_name">[^<]*</string>',
                         '<string name="app_name">Counter Strike 1.6</string>', s)
          else:
              s = s.replace('</resources>',
                            '    <string name="app_name">Counter Strike 1.6</string>\n</resources>')
          sp.write_text(s)
          PY
          fi

      - name: Rebuild APK
        run: |
          set -euo pipefail
          apktool b decoded -o unsigned.apk
          ls -lh unsigned.apk

      - name: Zipalign
        run: |
          set -euo pipefail
          zipalign -f -p 4 unsigned.apk aligned.apk
          ls -lh aligned.apk

      - name: Sign APK
        run: |
          set -euo pipefail
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          APKSIGNER=$(find /usr/local/lib/android/sdk -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "no apksigner"; exit 1; }
          "$APKSIGNER" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out CS16Client-${{ env.TARGET_ABI }}-standalone.apk \
            aligned.apk
          ls -lh CS16Client-${{ env.TARGET_ABI }}-standalone.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          OUT=CS16Client-${{ env.TARGET_ABI }}-standalone.apk
          unzip -l "$OUT" | grep '\.so' || true
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: CS16Client-standalone
          path: CS16Client-${{ env.TARGET_ABI }}-standalone.apk
          retention-days: 30
          if-no-files-found: error
