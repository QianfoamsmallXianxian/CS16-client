name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: r26d
  TARGET_ABI: arm64-v8a
  TARGETOS: android
  TARGETARCH: arm64

jobs:
  engine:
    name: Build Xash3D Engine
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          path: xash3d-fwgs
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache

      - name: Diagnose gha scripts
        working-directory: xash3d-fwgs
        run: |
          ls -la scripts/gha/ || true
          head -80 scripts/gha/deps_android.sh 2>/dev/null || echo "no deps_android.sh"
          head -80 scripts/gha/build_android.sh 2>/dev/null || echo "no build_android.sh"

      - name: Run deps_android.sh
        working-directory: xash3d-fwgs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          chmod +x scripts/gha/*.sh
          bash scripts/gha/deps_android.sh

      - name: Run build_android.sh
        working-directory: xash3d-fwgs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          bash scripts/gha/build_android.sh

      - name: Locate build outputs
        run: |
          find xash3d-fwgs -maxdepth 2 -type d -name 'build*' || true
          find xash3d-fwgs -path '*arm64*' -name '*.so' -exec ls -lh {} \; || true
          find xash3d-fwgs -name '*.so' | head -40 || true

      - name: Extract so
        run: |
          set -euo pipefail
          mkdir -p engine-libs
          find xash3d-fwgs -path '*arm64*' -name '*.so' -exec cp -v {} engine-libs/ \; || true
          if [ -z "$(ls -A engine-libs 2>/dev/null)" ]; then
            find xash3d-fwgs -name '*.so' \
              ! -path '*x86*' ! -path '*armeabi-v7a*' ! -path '*i686*' \
              -exec cp -v {} engine-libs/ \;
          fi
          ls -lh engine-libs/ || true
          test -n "$(ls -A engine-libs 2>/dev/null)" || { echo "no so"; exit 1; }

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-libs
          path: engine-libs/*.so
          retention-days: 7
          if-no-files-found: error

  apk:
    name: Build Standalone APK
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: engine-libs
          path: engine-libs

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Inject engine
        run: |
          set -euo pipefail
          DEST="android/app/src/main/jniLibs/${{ env.TARGET_ABI }}"
          mkdir -p "$DEST"
          cp -v engine-libs/*.so "$DEST/"
          ls -lh "$DEST/"

      - name: Set app name
        run: |
          python3 - << 'PY'
          import re, pathlib
          sp = pathlib.Path('android/app/src/main/res/values/strings.xml')
          if sp.exists():
              s = sp.read_text()
              if 'name="app_name"' in s:
                  s = re.sub(r'<string name="app_name">[^<]*</string>',
                             '<string name="app_name">Counter Strike 1.6</string>', s)
              else:
                  s = s.replace('</resources>',
                                '    <string name="app_name">Counter Strike 1.6</string>\n</resources>')
              sp.write_text(s)
          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if mf.exists():
              s = mf.read_text()
              if 'android:label="@string/app_name"' not in s:
                  s = re.sub(r'android:label="[^"]*"',
                             'android:label="Counter Strike 1.6"', s)
                  mf.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleGitDebug

      - name: Package APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          OUT="CS16Client-${{ env.TARGET_ABI }}-standalone.apk"
          cp "$APK" "$OUT"
          unzip -l "$OUT" | grep '\.so' || true
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CS16Client-standalone
          path: CS16Client-${{ env.TARGET_ABI }}-standalone.apk
          retention-days: 30
          if-no-files-found: error
