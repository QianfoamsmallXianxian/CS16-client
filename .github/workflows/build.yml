name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: 2.32.10
  TARGET_ABI: arm64-v8a
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_CMAKE: 3.22.1

jobs:
  engine:
    name: Build Xash3D Engine
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip xz-utils

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE}" || true

      - name: Prepare deps
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/hlsdk-portable 3rdparty/SDL
          git clone --depth 1 --recursive https://github.com/FWGS/hlsdk-portable 3rdparty/hlsdk-portable
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Patch deps_android
        run: |
          if [ -f scripts/gha/deps_android.sh ]; then
            printf '#!/bin/bash\nexit 0\n' > scripts/gha/deps_android.sh
            chmod +x scripts/gha/deps_android.sh
          fi

      - name: Build engine
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          bash scripts/gha/build_android.sh

      - name: Extract so
        run: |
          mkdir -p engine-libs
          find . -path '*arm64*' -name '*.so' -exec cp -v {} engine-libs/ \; || true
          test -n "$(ls -A engine-libs 2>/dev/null)"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-libs
          path: engine-libs/*.so
          retention-days: 7
          if-no-files-found: error

  apk:
    name: Build CS16 Client APK
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: engine-libs
          path: engine-libs

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip meson gperf

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE}" || true

      - name: Integrate engine Java layer
        run: |
          set +e
          rm -rf /tmp/xash /tmp/SDL2
          git clone --depth 1 --filter=blob:none --sparse https://github.com/FWGS/xash3d-fwgs /tmp/xash
          cd /tmp/xash
          git sparse-checkout set android/app/src/main/java android/app/src/main/res android/app/src/main/assets
          cd $GITHUB_WORKSPACE
          git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL.git /tmp/SDL2
          mkdir -p android/app/src/main/java/org
          if [ -d /tmp/SDL2/android-project/app/src/main/java/org/libsdl ]; then
            cp -rv /tmp/SDL2/android-project/app/src/main/java/org/libsdl android/app/src/main/java/org/ 2>/dev/null
          fi
          python3 ci-scripts/integrate_engine.py

      - name: Stub CrashReports
        run: |
          D=android/app/src/main/java/su/xash/engine/util
          mkdir -p "$D"
          if [ ! -f "$D/CrashReports.java" ]; then
            cat > "$D/CrashReports.java" << 'JAVA_EOF'
          package su.xash.engine.util;

          import android.content.Context;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.IOException;

          public class CrashReports {
              public static final String STACKTRACE_NAME = "stacktrace.txt";
              public static void writeSystemInfo(Context c) {
                  try {
                      File dir = new File(c.getFilesDir(), "crashes");
                      if (!dir.exists()) dir.mkdirs();
                      FileWriter w = new FileWriter(new File(dir, "system_info.txt"), true);
                      w.write("sdk: " + android.os.Build.VERSION.SDK_INT + "\n");
                      w.write("device: " + android.os.Build.DEVICE + "\n");
                      w.write("model: " + android.os.Build.MODEL + "\n");
                      w.close();
                  } catch (IOException e) {}
              }
              public static void writeIntentInfo(Context c, String info) {
                  try {
                      File dir = new File(c.getFilesDir(), "crashes");
                      if (!dir.exists()) dir.mkdirs();
                      FileWriter w = new FileWriter(new File(dir, "intent_info.txt"), true);
                      w.write(info);
                      w.write("\n");
                      w.close();
                  } catch (IOException e) {}
              }
          }
          JAVA_EOF
          fi

      - name: Add Android deps
        run: |
          python3 ci-scripts/add_deps.py

      - name: Patch XashActivity for crash tracking
        run: |
          python3 ci-scripts/patch_xashactivity.py || true

      - name: Fix FWGSLib
        run: |
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          mkdir -p cmake
          printf 'include(CMakeParseArguments)\nmacro(fwgs_fix_default_msvc_settings)\nendmacro()\nfunction(fwgs_set_default_properties target)\n    set_target_properties(${target} PROPERTIES CXX_STANDARD 17 CXX_STANDARD_REQUIRED ON POSITION_INDEPENDENT_CODE ON)\nendfunction()\nfunction(fwgs_add_compile_options target)\n    cmake_parse_arguments(ARG "" "" "PRIVATE;PUBLIC;INTERFACE" ${ARGN})\n    if(ARG_PRIVATE)\n        target_compile_options(${target} PRIVATE ${ARG_PRIVATE})\n    endif()\n    if(ARG_PUBLIC)\n        target_compile_options(${target} PUBLIC ${ARG_PUBLIC})\n    endif()\n    if(ARG_INTERFACE)\n        target_compile_options(${target} INTERFACE ${ARG_INTERFACE})\n    endif()\nendfunction()\nfunction(fwgs_install target)\nendfunction()\n' > cmake/FWGSLib.cmake
          grep -q 'list(APPEND CMAKE_MODULE_PATH' "$MF" || sed -i "1i list(APPEND CMAKE_MODULE_PATH \"\${CMAKE_CURRENT_SOURCE_DIR}/../../cmake\")" "$MF"
          sed -i 's|^[[:space:]]*# *include(FWGSLib)|include(FWGSLib)|' "$MF"
          sed -i 's|^[[:space:]]*# *fwgs_fix_default_msvc_settings()|fwgs_fix_default_msvc_settings()|' "$MF"

      - name: Fix XASH_SDK and STDINT_H
        run: |
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          grep -q 'xashmenu fixed include dirs' "$MF" || printf '\nif(TARGET ${MAINUI_LIBRARY})\n    target_include_directories(${MAINUI_LIBRARY} PRIVATE\n        ${CMAKE_CURRENT_SOURCE_DIR}/../../common\n        ${CMAKE_CURRENT_SOURCE_DIR}/../../engine\n        ${CMAKE_CURRENT_SOURCE_DIR}/../../pm_shared\n        ${CMAKE_CURRENT_SOURCE_DIR}/../../public\n    )\nendif()\n' >> "$MF"
          grep -q 'STDINT_H compile definition' "$MF" || printf '\nif(TARGET ${MAINUI_LIBRARY})\n    target_compile_definitions(${MAINUI_LIBRARY} PRIVATE "STDINT_H=<cstdint>")\nendif()\n' >> "$MF"
          python3 ci-scripts/fix_xashsdk.py

      - name: Fix sources
        run: python3 ci-scripts/fix_sources.py

      - name: Fix _format and int3
        run: |
          PH=common/port.h
          if [ -f "$PH" ] && ! grep -q 'define[[:space:]]*_format' "$PH"; then
            printf '\n#ifndef _format\n#if defined(__GNUC__)\n#define _format(x) __attribute__((format(printf,x,x+1)))\n#else\n#define _format(x)\n#endif\n#endif\n' >> "$PH"
          fi
          F=engine/menu_int.h
          if [ -f "$F" ] && ! grep -q '_format_fallback_injected' "$F"; then
            printf '/* CI _format_fallback_injected */\n#ifndef _format\n# if defined(__GNUC__)\n#  define _format(x) __attribute__((format(printf,x,x+1)))\n# else\n#  define _format(x)\n# endif\n#endif\n\n' > /tmp/mi_header.txt
            cat /tmp/mi_header.txt "$F" > /tmp/mi_new.h
            mv /tmp/mi_new.h "$F"
          fi
          python3 ci-scripts/fix_int3.py

      - name: Fix saverestore and version script
        run: |
          python3 ci-scripts/fix_saverestore.py
          MF=3rdparty/ReGameDLL_CS/CMakeLists.txt
          if [ -f "$MF" ] && ! grep -q 'CI_RELAX_PTR_CAST' "$MF"; then
            printf '\n# CI_RELAX_PTR_CAST\nadd_compile_options(-Wno-error=int-to-pointer-cast)\nadd_compile_options(-Wno-error=pointer-to-int-cast)\nadd_compile_options(-Wno-error=int-conversion)\nadd_compile_options(-Wno-error=constant-conversion)\nadd_compile_options(-Wno-error=shorten-64-to-32)\nadd_link_options(-Wl,--undefined-version)\n' >> "$MF"
          fi

      - name: Fix xashmenu link deps
        run: |
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          SYS=${{ github.workspace }}/sysroot
          if grep -q 'CI_XASHMENU_LINKS' "$MF"; then
            exit 0
          fi
          printf '\n# CI_XASHMENU_LINKS\nforeach(_tgt ${MAINUI_LIBRARY} xashmenu xashmenu64)\n    if(TARGET ${_tgt})\n        target_link_libraries(${_tgt} PRIVATE z)\n        target_link_directories(${_tgt} PRIVATE "%s/lib")\n        target_include_directories(${_tgt} PRIVATE "%s/include" "%s/include/freetype2")\n    endif()\nendforeach()\n' "$SYS" "$SYS" "$SYS" >> "$MF"

      - name: Restrict ABI and clean x86
        run: |
          find 3rdparty/ReGameDLL_CS -path '*linux32*' -name '*.so' -exec rm -v {} \; 2>/dev/null || true
          find 3rdparty/ReGameDLL_CS -path '*linux64*' -name '*.so' -exec rm -v {} \; 2>/dev/null || true
          find 3rdparty/ReGameDLL_CS -path '*win32*' -name '*.lib' -exec rm -v {} \; 2>/dev/null || true
          F=android/app/build.gradle
          test -f "$F" || F=android/app/build.gradle.kts
          if [ -f "$F" ]; then
            sed -i 's/abiFilters[^}]*/abiFilters "arm64-v8a"/' "$F" || true
          fi
          rm -rf android/app/.cxx android/.cxx 2>/dev/null || true

      - name: Inject engine libs and fix conflicts
        run: |
          set +e
          DEST="android/app/src/main/jniLibs/${TARGET_ABI}"
          mkdir -p "$DEST"

          KEEP="libxash.so libref_gl4es.so libfilesystem_stdio.so libSDL2.so libyapb_android_arm64.so"
          for so in engine-libs/*.so; do
            base=$(basename "$so")
            keep=0
            for k in $KEEP; do
              [ "$base" = "$k" ] && keep=1 && break
            done
            if [ $keep -eq 1 ]; then
              cp -v "$so" "$DEST/"
            else
              echo "SKIP: $base"
            fi
          done

          echo "=== 删除 xash3d 原版 libmenu.so ==="
          rm -f "$DEST/libmenu.so"
          echo "=== 删除假的系统库 ==="
          rm -f "$DEST/libandroid.so" "$DEST/libdl.so" "$DEST/liblog.so"
          echo "=== 最终 jniLibs ==="
          ls -lh "$DEST/"

      - name: Set app name
        run: python3 ci-scripts/set_app_name.py

      - name: Wrap all pkg_check_modules deep
        run: |
          set +e
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          grep -n 'pkg_check_modules' "$MF"
          sed -n '170,195p' "$MF"
          python3 ci-scripts/wrap_all_pkg.py
          grep -n -B1 -A1 'pkg_check_modules' "$MF"
          grep -n 'REQUIRED' "$MF" | head -20

      - name: Build APK
        id: build_apk
        continue-on-error: true
        working-directory: android
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
          LIBRARY_PATH: ${{ github.workspace }}/sysroot/lib
          LDFLAGS: -L${{ github.workspace }}/sysroot/lib
          PKG_CONFIG_PATH: ${{ github.workspace }}/sysroot/lib/pkgconfig:${{ github.workspace }}/sysroot/share/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/sysroot/lib/pkgconfig
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleGitDebug 2>&1 | tee /tmp/build_apk.log

      - name: Extract errors
        if: always()
        run: |
          mkdir -p /tmp/errors
          LOG=/tmp/build_apk.log
          OUT=/tmp/errors/errors.txt
          {
            echo "=== run_id: ${{ github.run_id }} ==="
            echo "=== commit: ${{ github.sha }} ==="
            echo ""
            echo "=== REAL ERRORS ==="
          } > "$OUT"
          if [ ! -f "$LOG" ]; then
            echo "no log" >> "$OUT"
            cat "$OUT"
            exit 0
          fi
          FILTER='force_align_arg_pointer|unknown-attributes|Wunknown-attributes|Wdeprecated-declarations|overrides a member function|no previous prototype|Wunused|Wsign-compare|Wshadow|Wformat|declared here|note: expanded|^note:|Wmissing-braces|Wpragma-pack|Wdivision-by-zero|Wswitch|Wparentheses|Wtautological|Wbitwise|Wsometimes-uninitialized|Wmacro-redefined|previous definition is here|at java\.base|at org\.gradle|at com\.android|at java\.util|at kotlin'

          echo "=== CMake Errors ===" >> "$OUT"
          grep -nE "CMake Error|CMake Warning at|CMakeLists\.txt:[0-9]+|CMake was unable|CMake could not|Include could not find|Unknown CMake|Cmake.*failed|target_|The source directory" "$LOG" | grep -vE "$FILTER" | head -100 >> "$OUT" || true

          echo "" >> "$OUT"
          echo "=== All error: lines ===" >> "$OUT"
          grep -nE "error:|fatal error:|FAILED:|undefined reference|ninja: build stopped|cannot find|undeclared|unknown type name|expected .* before|unrecognized|cannot open|no such file|Duplicate class" "$LOG" | grep -vE "$FILTER" | head -100 >> "$OUT" || true

          echo "" >> "$OUT"
          echo "=== Context around first CMake Error ===" >> "$OUT"
          FIRST_LINE=$(grep -nE "CMake Error|CMakeLists\.txt:[0-9]+.*Error" "$LOG" | head -1 | cut -d: -f1)
          if [ -n "$FIRST_LINE" ]; then
            START=$((FIRST_LINE - 20))
            END=$((FIRST_LINE + 40))
            [ $START -lt 1 ] && START=1
            sed -n "${START},${END}p" "$LOG" >> "$OUT"
          fi

          echo "" >> "$OUT"
          echo "=== TAIL (last 80) ===" >> "$OUT"
          tail -80 "$LOG" | grep -vE "$FILTER" >> "$OUT" || true
          wc -l "$OUT"
          cat "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-errors-log
          path: /tmp/errors/errors.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Package APK
        if: success()
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          cp "$APK" "CS16Client-${TARGET_ABI}-standalone.apk"
          APKSIGNER=$(find /usr/local/lib/android/sdk -name apksigner -type f | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "CS16Client-${TARGET_ABI}-standalone.apk" || true
          fi
          unzip -l "CS16Client-${TARGET_ABI}-standalone.apk" | grep '\.so$'
          sha256sum "CS16Client-${TARGET_ABI}-standalone.apk"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CS16Client-standalone
          path: CS16Client-${{ env.TARGET_ABI }}-standalone.apk
          retention-days: 30
          if-no-files-found: error

      - name: Force mainui_cpp to cs16-client branch
        run: |
          set +e
          rm -rf 3rdparty/mainui_cpp
          git clone --depth 1 --branch cs16-client --recursive https://github.com/Velaron/mainui_cpp 3rdparty/mainui_cpp
          cd 3rdparty/mainui_cpp
          for f in menus/client/JoinGame.cpp menus/client/JoinClass.cpp menus/client/ClientWindow.cpp; do
            [ -f "$f" ] || echo "MISSING: $f"
          done
          cd $GITHUB_WORKSPACE

      - name: Prepare SDL
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/SDL
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Generate cross file
        run: |
          NDK="$ANDROID_NDK_HOME"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf "[binaries]\nc = '%s/aarch64-linux-android21-clang'\ncpp = '%s/aarch64-linux-android21-clang++'\nar = '%s/llvm-ar'\nstrip = '%s/llvm-strip'\npkg-config = '/usr/bin/pkg-config'\n[host_machine]\nsystem = 'android'\ncpu_family = 'aarch64'\ncpu = 'aarch64'\nendian = 'little'\n[properties]\nneeds_exe_wrapper = true\n" "$BIN" "$BIN" "$BIN" "$BIN" > /tmp/android-arm64.ini

      - name: Build expat
        run: |
          set -e
          SYS=${{ github.workspace }}/sysroot
          mkdir -p "$SYS"
          cd /tmp
          wget -q https://github.com/libexpat/libexpat/releases/download/R_2_5_0/expat-2.5.0.tar.gz -O expat.tar.gz
          tar xzf expat.tar.gz
          cd expat-2.5.0
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${TARGET_ABI} -DANDROID_PLATFORM=android-21 -DCMAKE_INSTALL_PREFIX="$SYS" -DEXPAT_BUILD_TOOLS=OFF -DEXPAT_BUILD_EXAMPLES=OFF -DEXPAT_BUILD_TESTS=OFF -DEXPAT_BUILD_DOCS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target install

      - name: Build freetype
        run: |
          set -e
          SYS=${{ github.workspace }}/sysroot
          cd /tmp
          wget -q https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz -O ft.tar.gz
          tar xzf ft.tar.gz
          cd freetype-2.13.2
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${TARGET_ABI} -DANDROID_PLATFORM=android-21 -DCMAKE_INSTALL_PREFIX="$SYS" -DFT_DISABLE_HARFBUZZ=TRUE -DFT_DISABLE_BZIP2=TRUE -DFT_DISABLE_PNG=TRUE -DFT_DISABLE_BROTLI=TRUE -DFT_DISABLE_ZLIB=TRUE -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target install

      - name: Build fontconfig
        run: |
          set -e
          SYS=${{ github.workspace }}/sysroot
          cd /tmp
          wget -q https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/2.14.2/fontconfig-2.14.2.tar.gz -O fc.tar.gz
          tar xzf fc.tar.gz
          cd fontconfig-2.14.2
          export PKG_CONFIG_PATH="$SYS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYS/lib/pkgconfig"
          unset PKG_CONFIG_SYSROOT_DIR
          meson setup build --cross-file /tmp/android-arm64.ini --prefix="$SYS" --default-library=static -Ddoc=disabled -Dnls=disabled -Dtests=disabled -Dtools=disabled -Dcache-build=disabled || {
            cat build/meson-logs/meson-log.txt 2>/dev/null | tail -80
            exit 1
          }
          ninja -C build
          ninja -C build install

      - name: Copy headers to sysroot include
        run: |
          SYS=${{ github.workspace }}/sysroot
          mkdir -p "$SYS/include"
          if [ -d /tmp/freetype-2.13.2/include ]; then
            mkdir -p "$SYS/include/freetype2"
            cp -rv /tmp/freetype-2.13.2/include/* "$SYS/include/freetype2/" 2>/dev/null || true
          fi
          if [ -d /tmp/fontconfig-2.14.2/include/fontconfig ]; then
            mkdir -p "$SYS/include/fontconfig"
            cp -rv /tmp/fontconfig-2.14.2/include/fontconfig/* "$SYS/include/fontconfig/" 2>/dev/null || true
          fi
          if [ -f /tmp/expat-2.5.0/lib/expat.h ]; then
            cp -v /tmp/expat-2.5.0/lib/expat.h "$SYS/include/" 2>/dev/null || true
            cp -v /tmp/expat-2.5.0/lib/expat_external.h "$SYS/include/" 2>/dev/null || true
          fi
          ls -la "$SYS/include/" | head -20
          ls "$SYS/include/freetype2/" 2>/dev/null | head -5
          ls "$SYS/include/fontconfig/" 2>/dev/null | head -5

      - name: Ensure pkg-config files
        run: |
          set +e
          SYS=${{ github.workspace }}/sysroot
          mkdir -p "$SYS/lib/pkgconfig"
          ls -la "$SYS/lib/pkgconfig/" 2>/dev/null
          if [ ! -f "$SYS/lib/pkgconfig/freetype2.pc" ]; then
            printf 'prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\nName: FreeType 2\nDescription: A free high-quality and portable font engine.\nVersion: 26.0.0\nRequires:\nRequires.private:\nLibs: -L\${libdir} -lfreetype\nCflags: -I\${includedir} -I\${includedir}/freetype2\n' "$SYS" > "$SYS/lib/pkgconfig/freetype2.pc"
            echo "created freetype2.pc"
          fi
          if [ ! -f "$SYS/lib/pkgconfig/fontconfig.pc" ]; then
            printf 'prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\nName: Fontconfig\nDescription: Font configuration library\nVersion: 2.14.2\nRequires: freetype2\nRequires.private: expat\nLibs: -L\${libdir} -lfontconfig\nCflags: -I\${includedir} -I\${includedir}/fontconfig\n' "$SYS" > "$SYS/lib/pkgconfig/fontconfig.pc"
            echo "created fontconfig.pc"
          fi
          if [ ! -f "$SYS/lib/pkgconfig/expat.pc" ]; then
            printf 'prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\nName: expat\nDescription: expat XML parser\nVersion: 2.5.0\nLibs: -L\${libdir} -lexpat\nCflags: -I\${includedir}\n' "$SYS" > "$SYS/lib/pkgconfig/expat.pc"
            echo "created expat.pc"
          fi
          ls -la "$SYS/lib/pkgconfig/"
          cat "$SYS/lib/pkgconfig/freetype2.pc"

      - name: Patch pc absolute paths
        env:
          SYS: ${{ github.workspace }}/sysroot
        run: python3 ci-scripts/patch_pc.py

      - name: Prepend link_directories
        env:
          SYS: ${{ github.workspace }}/sysroot
        run: python3 ci-scripts/prepend_linkdirs.py

      - name: Copy sysroot libs to NDK
        run: |
          SYS=${{ github.workspace }}/sysroot
          NDK_SYS="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          mkdir -p "$NDK_SYS/usr/lib/aarch64-linux-android" "$NDK_SYS/usr/include"
          cp -v "$SYS"/lib/*.a "$NDK_SYS/usr/lib/aarch64-linux-android/" 2>/dev/null || true
          cp -rv "$SYS"/include/* "$NDK_SYS/usr/include/" 2>/dev/null || true

      - name: Wire fontconfig
        run: |
          SYS=${{ github.workspace }}/sysroot
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          if ! grep -q 'CI_FONTCONFIG_WIRED' "$MF"; then
            printf '\n# CI_FONTCONFIG_WIRED\nif(TARGET ${MAINUI_LIBRARY})\n    target_include_directories(${MAINUI_LIBRARY} PRIVATE\n        %s/include\n        %s/include/freetype2\n    )\n    target_link_libraries(${MAINUI_LIBRARY} PRIVATE\n        %s/lib/libfontconfig.a\n        %s/lib/libfreetype.a\n        %s/lib/libexpat.a\n    )\nendif()\n' "$SYS" "$SYS" "$SYS" "$SYS" "$SYS" >> "$MF"
          fi
