name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: 2.32.10
  TARGET_ABI: arm64-v8a
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_CMAKE: 3.22.1

jobs:
  engine:
    name: Build Xash3D Engine
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip xz-utils

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.ccache
            android/.cxx
          key: xash-${{ env.TARGET_ABI }}-${{ env.ANDROID_NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            xash-${{ env.TARGET_ABI }}-${{ env.ANDROID_NDK_VERSION }}-
            xash-${{ env.TARGET_ABI }}-

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          test -n "$SDKMGR" || { echo "no sdkmanager"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE}" || true

      - name: Prepare deps
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/hlsdk-portable 3rdparty/SDL
          git clone --depth 1 --recursive https://github.com/FWGS/hlsdk-portable 3rdparty/hlsdk-portable
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Patch deps_android
        run: |
          if [ -f scripts/gha/deps_android.sh ]; then
            printf '#!/bin/bash\nexit 0\n' > scripts/gha/deps_android.sh
            chmod +x scripts/gha/deps_android.sh
          fi

      - name: Build engine
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          bash scripts/gha/build_android.sh

      - name: Extract so
        if: success()
        run: |
          mkdir -p engine-libs
          find . -path '*arm64*' -name '*.so' -exec cp -v {} engine-libs/ \; || true
          if [ -z "$(ls -A engine-libs 2>/dev/null)" ]; then
            find . -name '*.so' \
              ! -path '*x86*' ! -path '*armeabi-v7a*' ! -path '*i686*' \
              -exec cp -v {} engine-libs/ \;
          fi
          test -n "$(ls -A engine-libs 2>/dev/null)" || { echo "no so"; exit 1; }
          ls -lh engine-libs/

      - name: Upload engine libs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engine-libs
          path: engine-libs/*.so
          retention-days: 7
          if-no-files-found: error

  apk:
    name: Build CS16 Client APK
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout CS16-client
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download engine libs
        uses: actions/download-artifact@v4
        with:
          name: engine-libs
          path: engine-libs

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          test -n "$SDKMGR" || { echo "no sdkmanager"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE}" || true

      - name: Prepare deps
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/SDL
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Diagnose cmake
        run: |
          ls -la cmake/ || true
          ls -la 3rdparty/mainui_cpp/cmake/ || true
          grep -n 'CMAKE_MODULE_PATH' CMakeLists.txt 3rdparty/mainui_cpp/CMakeLists.txt || true
          echo "=== mainui pkg_check_modules 行 ==="
          grep -n 'pkg_check_modules\|pkg_search_module\|find_package' 3rdparty/mainui_cpp/CMakeLists.txt || true

      - name: Generate FWGSLib stub
        run: |
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || { echo "no mainui CMakeLists"; exit 1; }
          grep -oE 'fwgs_[a-zA-Z_][a-zA-Z0-9_]*' "$MF" | sort -u > /tmp/fwgs_funcs.txt
          cat /tmp/fwgs_funcs.txt
          mkdir -p cmake
          {
            echo "# auto-generated FWGSLib stub"
            while IFS= read -r fn; do
              [ -z "$fn" ] && continue
              printf 'function(%s)\nendfunction()\n\n' "$fn"
            done < /tmp/fwgs_funcs.txt
          } > cmake/FWGSLib.cmake
          cat cmake/FWGSLib.cmake

      - name: Force module path in mainui
        run: |
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          if ! grep -q 'list(APPEND CMAKE_MODULE_PATH' "$MF"; then
            sed -i "1i list(APPEND CMAKE_MODULE_PATH \"\${CMAKE_CURRENT_SOURCE_DIR}/../../cmake\")" "$MF"
          fi
          sed -i 's|^[[:space:]]*# *include(FWGSLib)|include(FWGSLib)|' "$MF" || true
          sed -i 's|^[[:space:]]*# *fwgs_fix_default_msvc_settings()|fwgs_fix_default_msvc_settings()|' "$MF" || true
          head -30 "$MF"

      - name: Patch desktop deps
        run: |
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || { echo "no mainui CMakeLists"; exit 1; }
          python3 - << 'PY'
          import re, pathlib
          p = pathlib.Path('3rdparty/mainui_cpp/CMakeLists.txt')
          lines = p.read_text().splitlines()
          out = []
          targets = ('fontconfig', 'freetype', 'freetype2', 'x11', 'wayland')
          for ln in lines:
              m = re.match(r'^(\s*)pkg_check_modules\s*\(\s*(\w+)', ln)
              m2 = re.match(r'^(\s*)pkg_search_module\s*\(\s*(\w+)', ln)
              key = None
              if m: key = m.group(2).lower()
              elif m2: key = m2.group(2).lower()
              if key in targets:
                  indent = (m or m2).group(1)
                  out.append(f'{indent}if(NOT ANDROID)')
                  out.append(ln)
                  out.append(f'{indent}endif()')
              else:
                  out.append(ln)
          p.write_text('\n'.join(out) + '\n')
          PY
          echo "=== pkg_check_modules 上下文 ==="
          grep -n -B1 -A1 'pkg_check_modules\|pkg_search_module' "$MF" || true

      - name: Inject engine libs
        run: |
          DEST="android/app/src/main/jniLibs/${TARGET_ABI}"
          mkdir -p "$DEST"
          cp -v engine-libs/*.so "$DEST/"
          ls -lh "$DEST/"

      - name: Set app name
        run: |
          python3 - << 'PY'
          import re, pathlib
          sp = pathlib.Path('android/app/src/main/res/values/strings.xml')
          if sp.exists():
              s = sp.read_text()
              if 'name="app_name"' in s:
                  s = re.sub(r'<string name="app_name">[^<]*</string>',
                             '<string name="app_name">Counter Strike 1.6</string>', s)
              else:
                  s = s.replace('</resources>',
                                '    <string name="app_name">Counter Strike 1.6</string>\n</resources>')
              sp.write_text(s)
          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if mf.exists():
              s = mf.read_text()
              if 'android:label="@string/app_name"' not in s:
                  s = re.sub(r'android:label="[^"]*"',
                             'android:label="Counter Strike 1.6"', s)
                  mf.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleGitDebug

      - name: Locate APK
        if: always()
        run: |
          find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true

      - name: Package APK
        if: success()
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          OUT="CS16Client-${TARGET_ABI}-standalone.apk"
          cp "$APK" "$OUT"
          unzip -l "$OUT" | grep '\.so' || true
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CS16Client-standalone
          path: CS16Client-${TARGET_ABI}-standalone.apk
          retention-days: 30
          if-no-files-found: error
