name: Build CS16 Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ndk_version:
        required: false
        default: '29.0.14206865'
      sdl_version:
        required: false
        default: '2.32.10'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: ${{ github.event.inputs.sdl_version || '2.32.10' }}
  TARGET_ABI: arm64-v8a
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: ${{ github.event.inputs.ndk_version || '29.0.14206865' }}
  ANDROID_CMAKE: 3.22.1

jobs:
  engine:
    name: Build Xash3D Engine
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip xz-utils

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.ccache
            android/.cxx
          key: xash-${{ env.TARGET_ABI }}-${{ env.ANDROID_NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            xash-${{ env.TARGET_ABI }}-${{ env.ANDROID_NDK_VERSION }}-
            xash-${{ env.TARGET_ABI }}-

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          test -n "$SDKMGR" || { echo "no sdkmanager"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE}" || true

      - name: Prepare deps
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/hlsdk-portable 3rdparty/SDL
          git clone --depth 1 --recursive https://github.com/FWGS/hlsdk-portable 3rdparty/hlsdk-portable
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Patch deps_android
        run: |
          if [ -f scripts/gha/deps_android.sh ]; then
            printf '#!/bin/bash\nexit 0\n' > scripts/gha/deps_android.sh
            chmod +x scripts/gha/deps_android.sh
          fi

      - name: Build engine
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          bash scripts/gha/build_android.sh

      - name: Extract so
        if: success()
        run: |
          mkdir -p engine-libs
          find . -path '*arm64*' -name '*.so' -exec cp -v {} engine-libs/ \; || true
          if [ -z "$(ls -A engine-libs 2>/dev/null)" ]; then
            find . -name '*.so' \
              ! -path '*x86*' ! -path '*armeabi-v7a*' ! -path '*i686*' \
              -exec cp -v {} engine-libs/ \;
          fi
          test -n "$(ls -A engine-libs 2>/dev/null)" || { echo "no so"; exit 1; }

      - name: Upload engine libs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engine-libs
          path: engine-libs/*.so
          retention-days: 7
          if-no-files-found: error

  apk:
    name: Build CS16 Client APK
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: engine-libs
          path: engine-libs

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache wget unzip meson gperf

      - name: Link JDK
        run: |
          REAL_JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          rm -rf java
          ln -sfn "$REAL_JAVA" java

      - name: Setup Android SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          ln -sfn /usr/local/lib/android/sdk "$GITHUB_WORKSPACE/sdk"
          SDKMGR=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          test -n "$SDKMGR" || { echo "no sdkmanager"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE}" || true

      - name: Prepare SDL
        run: |
          mkdir -p 3rdparty
          rm -rf 3rdparty/SDL
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C 3rdparty
          mv "3rdparty/SDL2-${SDL_VERSION}" 3rdparty/SDL

      - name: Generate cross file
        run: |
          NDK="$ANDROID_NDK_HOME"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > /tmp/android-arm64.ini << CFEOF
          [binaries]
          c = '$BIN/aarch64-linux-android21-clang'
          cpp = '$BIN/aarch64-linux-android21-clang++'
          ar = '$BIN/llvm-ar'
          strip = '$BIN/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          CFEOF
          cat /tmp/android-arm64.ini

      - name: Build expat for android
        run: |
          set -e
          SYS=${{ github.workspace }}/sysroot
          mkdir -p "$SYS"
          cd /tmp
          wget -q https://github.com/libexpat/libexpat/releases/download/R_2_5_0/expat-2.5.0.tar.gz -O expat.tar.gz
          tar xzf expat.tar.gz
          cd expat-2.5.0
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${TARGET_ABI} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_INSTALL_PREFIX="$SYS" \
            -DEXPAT_BUILD_TOOLS=OFF \
            -DEXPAT_BUILD_EXAMPLES=OFF \
            -DEXPAT_BUILD_TESTS=OFF \
            -DEXPAT_BUILD_DOCS=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target install
          ls -lh "$SYS/lib/" || true
          ls "$SYS/lib/pkgconfig/" || true

      - name: Build freetype for android
        run: |
          set -e
          SYS=${{ github.workspace }}/sysroot
          cd /tmp
          wget -q https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz -O ft.tar.gz
          tar xzf ft.tar.gz
          cd freetype-2.13.2
          meson setup build \
            --cross-file /tmp/android-arm64.ini \
            --prefix="$SYS" \
            --default-library=static \
            -Dharfbuzz=disabled \
            -Dbzip2=disabled \
            -Dpng=disabled \
            -Dbrotli=disabled \
            -Dzlib=system \
            -Dtests=disabled
          ninja -C build
          ninja -C build install
          ls "$SYS/lib/" | grep -i freetype || true
          ls "$SYS/lib/pkgconfig/" | grep -i freetype || true

      - name: Build fontconfig for android
        run: |
          set -e
          SYS=${{ github.workspace }}/sysroot
          cd /tmp
          wget -q https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/2.14.2/fontconfig-2.14.2.tar.gz -O fc.tar.gz
          tar xzf fc.tar.gz
          cd fontconfig-2.14.2
          export PKG_CONFIG_PATH="$SYS/lib/pkgconfig:$SYS/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYS/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYS"
          meson setup build --cross-file /tmp/android-arm64.ini --prefix="$SYS" --default-library=static -Ddoc=disabled -Dnls=disabled -Dtests=disabled -Dtools=disabled -Dcache-build=disabled
          ninja -C build
          ninja -C build install
          ls "$SYS/lib/" | grep -i fontconfig || true
          find "$SYS/include" -name 'fontconfig.h' || true
          ls "$SYS/lib/pkgconfig/" | grep -i fontconfig || true

      - name: Wire fontconfig into xashmenu
        run: |
          set +e
          SYS=${{ github.workspace }}/sysroot
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          ls "$SYS/lib/"*.a 2>/dev/null
          find "$SYS" -name 'fontconfig.h' 2>/dev/null
          if ! grep -q 'CI_FONTCONFIG_WIRED' "$MF"; then
            {
              echo ''
              echo '# CI_FONTCONFIG_WIRED'
              echo 'if(TARGET ${MAINUI_LIBRARY})'
              echo '    target_include_directories(${MAINUI_LIBRARY} PRIVATE'
              echo '        "'"$SYS"'/include"'
              echo '        "'"$SYS"'/include/freetype2"'
              echo '    )'
              echo '    target_link_libraries(${MAINUI_LIBRARY} PRIVATE'
              echo '        "'"$SYS"'/lib/libfontconfig.a"'
              echo '        "'"$SYS"'/lib/libfreetype.a"'
              echo '        "'"$SYS"'/lib/libexpat.a"'
              echo '    )'
              echo 'endif()'
            } >> "$MF"
          fi
          grep -n 'CI_FONTCONFIG_WIRED' "$MF" || true

      - name: Fix FWGSLib
        run: |
          set +e
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          mkdir -p cmake
          {
            echo 'include(CMakeParseArguments)'
            echo 'macro(fwgs_fix_default_msvc_settings)'
            echo 'endmacro()'
            echo 'function(fwgs_set_default_properties target)'
            echo '    set_target_properties(${target} PROPERTIES CXX_STANDARD 17 CXX_STANDARD_REQUIRED ON POSITION_INDEPENDENT_CODE ON)'
            echo 'endfunction()'
            echo 'function(fwgs_add_compile_options target)'
            echo '    cmake_parse_arguments(ARG "" "" "PRIVATE;PUBLIC;INTERFACE" ${ARGN})'
            echo '    if(ARG_PRIVATE)'
            echo '        target_compile_options(${target} PRIVATE ${ARG_PRIVATE})'
            echo '    endif()'
            echo '    if(ARG_PUBLIC)'
            echo '        target_compile_options(${target} PUBLIC ${ARG_PUBLIC})'
            echo '    endif()'
            echo '    if(ARG_INTERFACE)'
            echo '        target_compile_options(${target} INTERFACE ${ARG_INTERFACE})'
            echo '    endif()'
            echo 'endfunction()'
            echo 'function(fwgs_install target)'
            echo 'endfunction()'
          } > cmake/FWGSLib.cmake
          grep -q 'list(APPEND CMAKE_MODULE_PATH' "$MF" || \
            sed -i "1i list(APPEND CMAKE_MODULE_PATH \"\${CMAKE_CURRENT_SOURCE_DIR}/../../cmake\")" "$MF"
          sed -i 's|^[[:space:]]*# *include(FWGSLib)|include(FWGSLib)|' "$MF"
          sed -i 's|^[[:space:]]*# *fwgs_fix_default_msvc_settings()|fwgs_fix_default_msvc_settings()|' "$MF"

      - name: Fix XASH_SDK and STDINT_H
        run: |
          set +e
          MF=3rdparty/mainui_cpp/CMakeLists.txt
          test -f "$MF" || exit 0
          grep -q 'xashmenu fixed include dirs' "$MF" || {
            echo '' >> "$MF"
            echo 'if(TARGET ${MAINUI_LIBRARY})' >> "$MF"
            echo '    target_include_directories(${MAINUI_LIBRARY} PRIVATE' >> "$MF"
            echo '        ${CMAKE_CURRENT_SOURCE_DIR}/../../common' >> "$MF"
            echo '        ${CMAKE_CURRENT_SOURCE_DIR}/../../engine' >> "$MF"
            echo '        ${CMAKE_CURRENT_SOURCE_DIR}/../../pm_shared' >> "$MF"
            echo '        ${CMAKE_CURRENT_SOURCE_DIR}/../../public' >> "$MF"
            echo '    )' >> "$MF"
            echo 'endif()' >> "$MF"
          }
          grep -q 'STDINT_H compile definition' "$MF" || {
            echo '' >> "$MF"
            echo 'if(TARGET ${MAINUI_LIBRARY})' >> "$MF"
            echo '    target_compile_definitions(${MAINUI_LIBRARY} PRIVATE "STDINT_H=<cstdint>")' >> "$MF"
            echo 'endif()' >> "$MF"
          }
          python3 - << 'PY'
          import pathlib, re
          p = pathlib.Path('3rdparty/mainui_cpp/CMakeLists.txt')
          s = p.read_text()
          for old, new in [
              (r'set\s*\(\s*XASH_SDK\s+"\.\./"\s*\)', 'set(XASH_SDK "../../")'),
              (r'set\s*\(\s*XASH_SDK\s+\.\./\s*\)', 'set(XASH_SDK "../../")'),
          ]:
              s, _ = re.subn(old, new, s)
          p.write_text(s)
          PY

      - name: Fix sources int64 bruh
        run: |
          set +e
          python3 - << 'PY'
          import pathlib, re
          root = pathlib.Path('3rdparty/mainui_cpp').resolve()
          if root.exists():
              pat = re.compile(r'(?<![A-Za-z0-9_./-])([A-Za-z0-9_./-]+\.(?:cpp|cc|cxx|c))(?![A-Za-z0-9_])')
              for cm in list(root.rglob('CMakeLists.txt')) + list(root.rglob('*.cmake')):
                  try: text = cm.read_text()
                  except: continue
                  base = cm.parent
                  new = text
                  for m in pat.finditer(text):
                      rel = m.group(1)
                      if (base / rel).resolve().exists(): continue
                      name = pathlib.Path(rel).name
                      hits = [x for x in base.rglob('*') if x.is_file() and x.name.lower() == name.lower()]
                      if hits:
                          nr = str(hits[0].relative_to(base)).replace('\\','/')
                          new = new.replace(rel, nr)
                          continue
                      new = re.sub(r'(?m)^[ \t]*' + re.escape(rel) + r'[ \t]*\n', '', new)
                      new = re.sub(r'\s+' + re.escape(rel) + r'(?=\s)', ' ', new)
                  if new != text: cm.write_text(new)

          GUARD = 'XASH_INT64_TYPES_DEFINED'
          for path, olds in [
              ('3rdparty/mainui_cpp/miniutl/miniutl.h', [
                  ('typedef int64_t int64;', '#ifndef ' + GUARD + '\ntypedef int64_t int64;'),
                  ('typedef uint64_t uint64;', 'typedef uint64_t uint64;\n#endif'),
              ]),
              ('engine/archtypes.h', [
                  ('typedef long long int64;', '#ifndef ' + GUARD + '\n#define ' + GUARD + ' 1\ntypedef long long int64;'),
                  ('typedef unsigned long long uint64;', 'typedef unsigned long long uint64;\n#endif'),
              ]),
          ]:
              p = pathlib.Path(path)
              if not p.exists(): continue
              s = p.read_text()
              if GUARD in s: continue
              for old, new in olds: s = s.replace(old, new)
              p.write_text(s)

          pats = [
              re.compile(r'^[ \t]*#[ \t]*define[ \t]+uint64[ \t]+uint64_bruh[ \t]*\r?\n', re.M),
              re.compile(r'^[ \t]*#[ \t]*define[ \t]+int64[ \t]+int64_bruh[ \t]*\r?\n', re.M),
              re.compile(r'^[ \t]*#undef[ \t]+uint64[ \t]*\r?\n', re.M),
              re.compile(r'^[ \t]*#undef[ \t]+int64[ \t]*\r?\n', re.M),
          ]
          for root2 in ['cl_dll','dlls','common','public','3rdparty/mainui_cpp']:
              r = pathlib.Path(root2)
              if not r.exists(): continue
              for f in r.rglob('*'):
                  if not f.is_file(): continue
                  if f.suffix not in ('.cpp','.cc','.cxx','.c','.h','.hpp','.hxx'): continue
                  try: s = f.read_text()
                  except: continue
                  s2 = s
                  for p in pats: s2 = p.sub('', s2)
                  if s2 != s: f.write_text(s2)
          PY

      - name: Fix _format and int3
        run: |
          set +e
          PH=common/port.h
          if [ -f "$PH" ] && ! grep -q 'define[[:space:]]*_format' "$PH"; then
            {
              echo ''
              echo '#ifndef _format'
              echo '#if defined(__GNUC__)'
              echo '#define _format(x) __attribute__((format(printf,x,x+1)))'
              echo '#else'
              echo '#define _format(x)'
              echo '#endif'
              echo '#endif'
            } >> "$PH"
          fi
          F=engine/menu_int.h
          if [ -f "$F" ] && ! grep -q '_format_fallback_injected' "$F"; then
            {
              echo '/* CI _format_fallback_injected */'
              echo '#ifndef _format'
              echo '# if defined(__GNUC__)'
              echo '#  define _format(x) __attribute__((format(printf,x,x+1)))'
              echo '# else'
              echo '#  define _format(x)'
              echo '# endif'
              echo '#endif'
              echo ''
            } > /tmp/mi_header.txt
            cat /tmp/mi_header.txt "$F" > /tmp/mi_new.h
            mv /tmp/mi_new.h "$F"
          fi
          python3 - << 'PY'
          import pathlib, re
          roots = ['3rdparty/ReGameDLL_CS', '3rdparty/mainui_cpp', 'dlls', 'cl_dll', 'engine', 'common']
          pats = [
              (re.compile(r'#\s*define\s+DebuggerBreak\s*\(\s*\)\s*[^\n]*'), '#define DebuggerBreak() ((void)0)'),
              (re.compile(r'#\s*define\s+DebuggerBreakIfDebugging\s*\(\s*\)\s*[^\n]*'), '#define DebuggerBreakIfDebugging() ((void)0)'),
              (re.compile(r'#\s*define\s+DebugBreak\s*\(\s*\)\s*[^\n]*'), '#define DebugBreak() ((void)0)'),
              (re.compile(r'__asm__\s+__volatile__\s*\(\s*"int3;?"\s*\)'), '((void)0)'),
              (re.compile(r'__asm__\s+volatile\s*\(\s*"int3;?"\s*\)'), '((void)0)'),
              (re.compile(r'asm\s+volatile\s*\(\s*"int3;?"\s*\)'), '((void)0)'),
              (re.compile(r'asm\s*\(\s*"int3;?"\s*\)'), '((void)0)'),
              (re.compile(r'__asm\s+int\s+3\s*;?'), '((void)0)'),
              (re.compile(r'__debugbreak\s*\(\s*\)'), '((void)0)'),
          ]
          for root in roots:
              r = pathlib.Path(root)
              if not r.exists(): continue
              for f in r.rglob('*'):
                  if not f.is_file(): continue
                  if f.suffix not in ('.cpp','.cc','.cxx','.c','.h','.hpp','.hxx','.inl'): continue
                  try: s = f.read_text()
                  except: continue
                  s2 = s
                  for pat, rep in pats: s2 = pat.sub(rep, s2)
                  if s2 != s: f.write_text(s2)
          PY

      - name: Fix saverestore and version script
        run: |
          set +e
          F=3rdparty/ReGameDLL_CS/regamedll/dlls/saverestore.cpp
          if [ -f "$F" ]; then
            python3 - << 'PY'
            import pathlib
            p = pathlib.Path('3rdparty/ReGameDLL_CS/regamedll/dlls/saverestore.cpp')
            lines = p.read_text().splitlines()
            if len(lines) >= 429:
                idx = 428
                orig = lines[idx]
                new = orig.replace('(uint32)', '(uint32)(uintptr_t)')
                new = new.replace('reinterpret_cast<uint32>', 'reinterpret_cast<uint32>(reinterpret_cast<uintptr_t>')
                if new != orig:
                    lines[idx] = new
                    p.write_text('\n'.join(lines) + '\n')
                    print('patched 429')
            PY
          fi
          python3 - << 'PY'
          import pathlib, re
          root = pathlib.Path('3rdparty/ReGameDLL_CS')
          if not root.exists(): raise SystemExit(0)
          pat = re.compile(r'[ \t]*__gcclibcxx_demangle_callback[ \t]*;?[ \t]*\r?\n')
          for f in root.rglob('*'):
              if not f.is_file(): continue
              try: s = f.read_text()
              except: continue
              if '__gcclibcxx_demangle_callback' in s:
                  s2 = pat.sub('', s)
                  if s2 != s: f.write_text(s2)
          PY
          MF=3rdparty/ReGameDLL_CS/CMakeLists.txt
          if [ -f "$MF" ] && ! grep -q 'CI_RELAX_PTR_CAST' "$MF"; then
            {
              echo ''
              echo '# CI_RELAX_PTR_CAST'
              echo 'add_compile_options(-Wno-error=int-to-pointer-cast)'
              echo 'add_compile_options(-Wno-error=pointer-to-int-cast)'
              echo 'add_compile_options(-Wno-error=int-conversion)'
              echo 'add_compile_options(-Wno-error=constant-conversion)'
              echo 'add_compile_options(-Wno-error=shorten-64-to-32)'
              echo 'add_link_options(-Wl,--undefined-version)'
            } >> "$MF"
          fi
          MF2=3rdparty/mainui_cpp/CMakeLists.txt
          if [ -f "$MF2" ] && ! grep -q 'CI_DESKTOP_WRAP' "$MF2"; then
            python3 - << 'PY'
            import re, pathlib
            p = pathlib.Path('3rdparty/mainui_cpp/CMakeLists.txt')
            lines = p.read_text().splitlines()
            out = []
            targets = ('fontconfig','freetype','freetype2','x11','wayland','glib','pango','xkbcommon','xi','xcursor','xinerama','xrandr','xss','xext','alsa','pulse','pulseaudio','dbus','libusb','udev')
            for ln in lines:
                m = re.match(r'^(\s*)pkg_check_modules\s*\(\s*(\S+)\s+(?:REQUIRED\s+|QUIET\s+|NO_CMAKE_PATH\s+)*([\w.-]+)', ln)
                if m:
                    indent, module = m.group(1), m.group(3).lower().split('>=')[0].split('<')[0].strip()
                    if module in targets or any(module.startswith(t) for t in targets):
                        out.append(f'{indent}if(NOT ANDROID)')
                        out.append(ln)
                        out.append(f'{indent}endif()')
                        continue
                out.append(ln)
            p.write_text('\n'.join(out) + '\n')
            PY
          fi
          cp -v engine-libs/*.so android/app/src/main/jniLibs/${TARGET_ABI}/ 2>/dev/null || {
            DEST="android/app/src/main/jniLibs/${TARGET_ABI}"
            mkdir -p "$DEST"
            cp -v engine-libs/*.so "$DEST/"
          }

      - name: Set app name
        run: |
          python3 - << 'PY'
          import re, pathlib
          sp = pathlib.Path('android/app/src/main/res/values/strings.xml')
          if sp.exists():
              s = sp.read_text()
              if 'name="app_name"' in s:
                  s = re.sub(r'<string name="app_name">[^<]*</string>',
                             '<string name="app_name">Counter Strike 1.6</string>', s)
              else:
                  s = s.replace('</resources>',
                                '    <string name="app_name">Counter Strike 1.6</string>\n</resources>')
              sp.write_text(s)
          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if mf.exists():
              s = mf.read_text()
              if 'android:label="@string/app_name"' not in s:
                  s = re.sub(r'android:label="[^"]*"', 'android:label="Counter Strike 1.6"', s)
                  mf.write_text(s)
          PY

      - name: Build APK
        id: build_apk
        continue-on-error: true
        working-directory: android
        env:
          ANDROID_HOME: ${{ github.workspace }}/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
          JAVA_HOME: ${{ github.workspace }}/java
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleGitDebug 2>&1 | tee /tmp/build_apk.log

      - name: Extract errors only
        if: always()
        run: |
          set +e
          mkdir -p /tmp/errors
          LOG=/tmp/build_apk.log
          OUT=/tmp/errors/errors.txt
          {
            echo "=== run_id: ${{ github.run_id }} ==="
            echo "=== commit: ${{ github.sha }} ==="
            echo "=== timestamp: $(date -u +%FT%TZ) ==="
            echo ""
            echo "=== REAL ERRORS ==="
          } > "$OUT"
          if [ ! -f "$LOG" ]; then
            echo "no build log" >> "$OUT"
            cat "$OUT"
            exit 0
          fi
          FILTER='force_align_arg_pointer|unknown-attributes|Wunknown-attributes|Wdeprecated-declarations|overrides a member function|no previous prototype|Wunused|Wsign-compare|Wshadow|Wformat|declared here|note: expanded|in file included from|^note:|Wmissing-braces|Wpragma-pack|Wdivision-by-zero|Wswitch|Wparentheses|Wtautological|Wbitwise|Wsometimes-uninitialized|Wmacro-redefined|previous definition is here'
          grep -nE "error:|fatal error:|FAILED:|FAILURE:|undefined reference|ninja: build stopped|What went wrong|Execution failed|Caused by:|ld: |cannot find|undeclared|unknown type name|expected .* before|unrecognized|cannot open|no such file" "$LOG" \
            | grep -vE "$FILTER" | head -200 >> "$OUT" || true
          {
            echo ""
            echo "=== TAIL (last 60) ==="
          } >> "$OUT"
          tail -60 "$LOG" | grep -vE "$FILTER" >> "$OUT" || true
          wc -l "$OUT"
          cat "$OUT"

      - name: Upload errors log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors-log
          path: /tmp/errors/errors.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Package APK
        if: success()
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          OUT="CS16Client-${TARGET_ABI}-standalone.apk"
          cp "$APK" "$OUT"
          unzip -l "$OUT" | grep '\.so' || true
          sha256sum "$OUT"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CS16Client-standalone
          path: CS16Client-${TARGET_ABI}-standalone.apk
          retention-days: 30
          if-no-files-found: error
